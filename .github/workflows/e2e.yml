name: E2E

# Playwright against a production build with the same settings as the local gate (README, "Checks before a pull request"). The run is in
# memory with no D1 or Cloudflare account (E2E_FAKE_BACKENDS, set by playwright.config.ts), so it needs no secrets.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    # The Playwright image has the browsers and their system libraries built in, so there is no install step to stall.
    # Keep the tag in step with @playwright/test in package-lock.json (ci.yml checks it).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 30
    env:
      APP_ENV: production
      NEXT_PUBLIC_ADMIN_OPEN: 1 # the app is closed on a deployed site; the specs need it open
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000BB # Cloudflare's always-pass test key; the sign-in specs stub its script
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run stock:redate # sold cars leave the 30 day window; keep the demo dates fresh
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
