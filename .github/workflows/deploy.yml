name: Deploy (Cloudflare Workers)

# One workflow deploys both environments (README, "Two environments"):
# - A merge to main deploys dev (dev.dash.checkwork.ie). Production changes only through a release.
# - release.yml calls this with environment production and the new tag.
# - Run by hand from the Actions tab: dev from main or any commit, or production from a release tag (a rollback: pick an older tag).
# preview.yml also calls it, to try a branch on dev. Lint and the unit tests run first. Needs the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID repo secrets (README, "GitHub Actions"). If Actions is unavailable, npm run deploy / deploy:prod from a laptop
# does the same steps (scripts/deploy.mjs).
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_call:
    inputs:
      environment:
        description: 'dev or production'
        required: true
        type: string
      ref:
        description: 'The tag, branch or commit to deploy'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: 'Where to deploy'
        required: true
        default: dev
        type: choice
        options: [dev, production]
      ref:
        description: 'dev: a branch, tag or commit (default main). production: a release tag like v1.0.0 (required)'
        required: false
        type: string

# One deploy to an environment at a time (preview.yml shares dev's group). A queued one waits; a running one is never cancelled.
concurrency:
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Not from another branch picked in the Run workflow menu: it would run that branch's copy of this file with the Cloudflare secrets
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A push has no inputs: it is dev
      TARGET: ${{ inputs.environment || 'dev' }}
      REF: ${{ inputs.ref }}
      NEXT_TELEMETRY_DISABLED: 1
      WRANGLER_SEND_METRICS: false
      # The Cloudflare token is set on the deploy step only, not here: npm install scripts, lint and the tests never see it
    steps:
      - name: Check where and what
        run: |
          case "$TARGET" in
            dev) ;;
            production) printf '%s' "$REF" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::Production deploys a release tag like v1.0.0, not '${REF:-nothing}'"; exit 1; } ;;
            *) echo "::error::The environment is dev or production, not '$TARGET'"; exit 1 ;;
          esac
      - uses: actions/checkout@v7
        with:
          # A production ref is a tag, spelled out so a branch of the same name cannot be picked
          ref: ${{ inputs.environment == 'production' && format('refs/tags/{0}', inputs.ref) || inputs.ref }}
          # Every commit and tag, to check below that a production commit is on main
          fetch-depth: 0
      # Here, from this workflow on main, not only in scripts/deploy.mjs of the checked-out code: a tag pushed on any commit would
      # carry its own deploy.mjs. The release workflow tags main, and a rollback tag was on main when it was made.
      - name: Production is a commit on main
        if: inputs.environment == 'production'
        run: git merge-base --is-ancestor HEAD origin/main || { echo "::error::$REF is not on main"; exit 1; }
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # APP_ENV is not set: the tests fail on a production setting while the finance figures are placeholders (.env.example)
      - run: npm run lint
      - run: npm test
      # The OpenNext build, with no Cloudflare credentials in its environment. --build-only and --built are for this workflow (scripts/deploy.mjs).
      - name: Build ${{ inputs.environment || 'dev' }}
        run: npm run ${{ inputs.environment == 'production' && 'deploy:prod' || 'deploy' }} -- --build-only
      # The directory and dealer migrations (before the new code is live, so additive only), then the Worker, its version tagged with the
      # commit. Production also refuses a dirty tree or a commit not on main (scripts/deploy.mjs).
      - name: Migrate and deploy ${{ inputs.environment || 'dev' }}
        run: npm run ${{ inputs.environment == 'production' && 'deploy:prod' || 'deploy' }} -- --built
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Cloudflare's edge reaches the Worker and it does not fail (a 5xx, or no answer). Behind Access most addresses answer a visitor
      # without a token with a redirect or a 404, so this alone does not prove the new code runs: the next step does. A first deploy of
      # a domain waits for its certificate.
      - name: Check the site answers
        run: |
          host=dev.dash.checkwork.ie
          [ "$TARGET" = production ] && host=www.dash.checkwork.ie
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://$host/api/site/v1/stock" || true)
            echo "https://$host: $code"
            case "$code" in [1-4]??) exit 0 ;; esac
            sleep 10
          done
          echo "::error::$host still answers $code after 5 minutes"
          exit 1
      # The Worker's live deployment is one version at 100%, tagged with this commit (read from Cloudflare, so it needs the token)
      - name: Check the new version is live
        run: node scripts/live-version.mjs ${{ inputs.environment == 'production' && '--env production' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
