name: Deploy (Cloudflare Workers)

# A merge to main deploys production. A run from the Actions tab deploys dev or production, from main or from an older tag or commit (a
# roll back). Lint and the unit tests run first. Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets.
# Actions minutes are often out, so this is not the only way: npm run deploy (dev) or npm run deploy:prod from a laptop does the same
# steps (scripts/deploy.mjs, README).
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Where to deploy'
        required: true
        default: dev
        type: choice
        options: [dev, production]
      ref:
        description: 'A tag or commit to deploy (default: the branch it runs from)'
        required: false
        type: string

concurrency:
  group: deploy-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_TELEMETRY_DISABLED: 1
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # deploy:prod checks the commit is on main
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The OpenNext build, the directory and dealer migrations (before the new code is live, so additive only), then the deploy.
      # A push is production; a manual run is the environment it was given.
      - name: Deploy ${{ (github.event_name == 'push' || inputs.environment == 'production') && 'production' || 'dev' }}
        run: npm run ${{ (github.event_name == 'push' || inputs.environment == 'production') && 'deploy:prod' || 'deploy' }}
