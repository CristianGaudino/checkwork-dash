<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Offline | Checkwork</title>
<!-- Shown by public/sw.js when a page cannot load. Static, so it needs nothing from the server. Colours from src/app/globals.css. -->
<style>
  :root { --surface: #f4f6fb; --text: #161a33; --text-2: #4a5070; --accent: #5a5deb; }
  @media (prefers-color-scheme: dark) { :root { --surface: #0b0f1f; --text: #f4f6fb; --text-2: #b4b9d0; } }
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 0 16px; background: var(--surface); color: var(--text); font: 16px/1.5 system-ui, sans-serif; text-align: center; }
  main { display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 28rem; }
  h1 { margin: 0; font-size: 1.375rem; }
  p { margin: 0; color: var(--text-2); }
  a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<main>
  <img src="/brand/app-192.png" alt="" width="64" height="64" style="border-radius:14px">
  <h1>You are offline</h1>
  <p>Check your connection and try again.</p>
  <a href="">Try again</a>
</main>
</body>
</html>
